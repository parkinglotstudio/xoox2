<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리소스 뷰어</title>
<style>
:root{--bg:#14121c;--panel:#1d1a28;--ink:#ece9f6;--sub:#9a96ad;--line:#2f2b3e;--accent:#a585ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.5 "Malgun Gothic",system-ui,sans-serif}
body{display:flex}
aside{width:300px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside header{padding:12px 14px;border-bottom:1px solid var(--line)}
aside header b{display:block;font-size:14px}
aside header code{font-size:11px;color:var(--sub);word-break:break-all}
#filter{margin:8px 14px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
#list{flex:1;overflow:auto;padding:0 6px 10px}
#list button{display:flex;justify-content:space-between;gap:6px;width:100%;text-align:left;background:none;border:none;color:var(--ink);padding:5px 8px;border-radius:6px;cursor:pointer;font:inherit}
#list button:hover{background:#2a2540}
#list button.on{background:var(--accent);color:#14121c}
#list button span{color:var(--sub);font-size:11px;white-space:nowrap}
#list button.on span{color:#14121c}
#list .grp{color:var(--sub);font-size:11px;padding:8px 8px 2px}
main{flex:1;position:relative;min-width:0}
canvas{display:block;width:100%;height:100%}
#img{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0c0a12}
#img img{max-width:94%;max-height:94%}
#info{position:absolute;left:12px;top:10px;font-size:12px;color:var(--sub);pointer-events:none;text-shadow:0 1px 2px #000}
#info b{color:var(--ink);font-size:14px}
#anims{position:absolute;left:12px;bottom:12px;right:12px;display:flex;flex-wrap:wrap;gap:6px}
#anims button{background:rgba(29,26,40,.9);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer;font:inherit}
#anims button.on{border-color:var(--accent);background:#3a2f60}
#pre{position:absolute;inset:40px 12px 12px;overflow:auto;display:none;white-space:pre-wrap;font:12px/1.5 Consolas,monospace;background:#0c0a12;border-radius:10px;padding:12px;margin:0}
</style>
</head>
<body>
<aside>
  <header><b id="title">리소스 뷰어</b><code id="where"></code></header>
  <input id="filter" placeholder="이름으로 거르기">
  <div id="list"></div>
</aside>
<main>
  <canvas id="cv"></canvas>
  <div id="img"><img id="imgEl" alt=""></div>
  <pre id="pre"></pre>
  <div id="info"></div>
  <div id="anims"></div>
</main>
<script type="module" src="/src/tools/viewer/main.ts"></script>
</body>
</html>
