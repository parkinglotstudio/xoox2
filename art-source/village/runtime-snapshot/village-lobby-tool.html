<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath fill=%27%238bcbb2%27 d=%27M4 10h24v18H4zM8 4h16v8H8z%27/%3E%3C/svg%3E"><title>정화숲 공중마을</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071724;color:#e9f2ee;font:14px/1.5 "Segoe UI","Malgun Gothic",sans-serif}#stage{position:absolute;inset:0 0 0 265px}canvas{display:block}aside{position:absolute;top:0;left:0;bottom:0;width:265px;padding:22px 18px;background:#102730;overflow-y:auto;border-right:1px solid #476366}h1{font-size:22px;margin:0;color:#ffe2a5}h2{font-size:13px;letter-spacing:.06em;margin:22px 0 10px;color:#9fcfbd}.sub{font-size:12px;color:#9cb7bb;margin:6px 0 18px}#clock{font-size:36px;letter-spacing:.04em;color:#f6e4b8;font-weight:600}input[type=range]{width:100%;accent-color:#8bcbb2}label{display:flex;align-items:center;gap:8px;margin:9px 0}button,select{color:#ddecdf;background:#24404a;border:1px solid #526d70;border-radius:7px;padding:7px 10px;font:inherit}button{cursor:pointer}button:hover{background:#38575d}.presets{display:flex;gap:4px;flex-wrap:wrap}.presets button{font-size:12px;padding:6px 8px}select{max-width:100%;width:100%}#reset{width:100%;margin:12px 0}#status{font-size:12px;color:#a9cbbf;min-height:36px}#stats{position:absolute;top:14px;left:283px;color:#e4f2ec;background:#0c222bba;padding:6px 10px;border-radius:7px;font:12px Consolas,monospace}.pet{display:grid;grid-template-columns:1fr 1.2fr;gap:1px 6px;border-top:1px solid #38535b;padding:8px 0}.pet b{color:#f2cc90;text-transform:capitalize}.pet span{font-size:12px}.pet small{grid-column:2;color:#9bb6b4}footer{font-size:11px;color:#8aa8aa;margin-top:18px}@media(max-width:800px){aside{width:210px;padding:15px 12px}#stage{left:210px}#stats{left:225px}h1{font-size:18px}}
</style></head><body><div id="stage"></div><aside><h1>정화숲 공중마을</h1><p class="sub">바다 위, 주민과 반려동물의 집</p><div id="clock">15:00</div><input id="hour" type="range" min="0" max="23.99" step=".01" value="15"><div class="presets"><button data-hour="6">새벽</button><button data-hour="9">아침</button><button data-hour="12">낮</button><button data-hour="18">노을</button><button data-hour="22">밤</button></div><label><input id="auto-time" type="checkbox" checked>시간 자동 흐름</label><select id="period" aria-label="하루 길이"><option value="1440">하루 = 24분</option><option value="480">하루 = 8분</option><option value="120">하루 = 2분</option><option value="86400">실제 24시간</option></select>
<h2>마을 둘러보기</h2><select id="focus" aria-label="카메라 보기"><option value="all">마을 전체</option><option value="region:main">모두의 집 · 식수와 식사</option><option value="region:pet">반려동물 쉼터</option><option value="region:garden">정화 물빛 정원</option><option value="region:workshop">바람 정비소</option><option value="region:lookout">등불 전망대</option><option value="airship">비행선 따라가기</option><option value="pet_nofilter">NoFilter의 집</option><option value="pet_flux">Flux의 집</option><option value="pet_lumos">Lumos의 집</option><option value="pet_gizmo">Gizmo의 집</option><option value="resident_ruon">루온</option><option value="resident_ria">리아</option></select><button id="reset">시안 구도로 돌아가기</button><p class="sub">드래그: 회전 · 휠: 확대 · 오른쪽 드래그: 이동</p>
<p id="region-description" class="sub">다섯 집이 식수·먹거리·정비·항로를 나누어 맡는 마을입니다.</p><h2>비행선 · 바람나루호</h2><div id="flight-state">정박 · 부유</div><button id="depart">지금 출항</button><label><input id="flight-auto" type="checkbox" checked>항로 자동 왕복</label><label><input id="flight-pause" type="checkbox">비행 잠시 멈춤</label><h2>마을 주민</h2><div id="residents">주민을 불러오는 중…</div><label><input id="resident-pause" type="checkbox">주민 생활 잠시 멈춤</label><h2>반려동물 생활</h2><div id="pets">주민을 불러오는 중…</div><label><input id="pet-pause" type="checkbox">펫 생활 잠시 멈춤</label><select id="speed" aria-label="산책 속도"><option value="1">생활 속도 1×</option><option value="2">생활 속도 2×</option><option value="4">생활 속도 4×</option></select>
<h2>표현과 경로</h2><label><input id="birds" type="checkbox" checked>복셀 바닷새 무리</label><label><input id="buoyancy" type="checkbox" checked>정화 코어 부유 효과</label><label><input id="falls" type="checkbox" checked>폭포 · 물보라</label><label><input id="waves" type="checkbox" checked>복셀 파도</label><label><input id="shadows" type="checkbox" checked>햇빛 그림자</label><label><input id="nav" type="checkbox">걸을 수 있는 지역</label><label><input id="paths" type="checkbox">펫 산책 경로</label><select id="pixel" aria-label="렌더 해상도"><option value="1">화질 1×</option><option value="1.25">화질 1.25×</option><option value=".75">가벼운 화질 0.75×</option></select><p id="status">마을을 준비하는 중…</p><footer>집에서 휴식 → 산책 → 둘러보기 → 귀가<br>밤에는 집 앞에서 쉬어요.<br>새는 낮에 바다 위를 날아요.<br>비행선과 산책은 장식 연출입니다.</footer></aside><div id="stats">준비 중</div><script type="module" src="/src/tools/villageLobby/main.ts"></script></body></html>
