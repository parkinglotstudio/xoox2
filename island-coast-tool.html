<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>섬 외곽 · 정화 후</title>
    <style>
      html, body { margin: 0; height: 100%; background: #071726; color: #e7f4f2; font-family: "Segoe UI", sans-serif; }
      #view { display: block; width: 100%; height: 100%; }
      .bar {
        position: fixed; left: 16px; top: 14px; z-index: 2;
        background: rgba(7, 23, 38, 0.82); border: 1px solid rgba(15, 190, 199, 0.45);
        padding: 10px 14px; border-radius: 10px; max-width: 360px;
      }
      .bar b { display: block; font-size: 16px; margin-bottom: 4px; }
      .bar span { display: block; font-size: 13px; line-height: 1.45; opacity: 0.9; }
    </style>
  </head>
  <body>
    <div class="bar">
      <b>섬 외곽 · 정화 후</b>
      <span>나무는 절벽 안쪽. 가운데는 풀밭. 드래그로 돌려 보고, 휠로 가까이.</span>
    </div>
    <canvas id="view"></canvas>
    <script type="module" src="/src/tools/islandCoast/main.ts"></script>
  </body>
</html>
