<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>정화숲 · 실제 플레이 제작실</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c181f;color:#e8f0e9;font:14px system-ui}header{height:65px;display:flex;align-items:center;gap:18px;padding:12px 24px;background:#152a2f;border-bottom:1px solid #a7d6bf30}header b{font-size:20px}a{color:#b2e9c9}main{display:grid;grid-template-columns:320px minmax(390px,1fr) 260px;height:calc(100dvh - 65px)}aside{padding:18px;overflow:auto;background:#102128}h2{font-size:15px;color:#a5d9c0;margin:18px 0 10px}button,select,input,textarea{font:inherit;color:inherit;background:#1c343b;border:1px solid #6b9b8a55;border-radius:8px;padding:9px}button{cursor:pointer}button:hover{background:#2b5154}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tabs button.on{background:#88d5af;color:#10251f;font-weight:800}label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;color:#c3d5ce}input{width:102px}select{width:170px}section.screen{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse,#1b363c,#071117);position:relative;overflow:hidden}iframe{height:100%;width:auto;aspect-ratio:390/844;border:0;max-width:100%;background:#0a1b22}.status{white-space:pre-wrap;line-height:1.8}small{color:#8ca99f}.wide{width:100%;background:#90d8b2;color:#122920;font-weight:800;margin:8px 0}.row{display:flex;gap:6px;flex-wrap:wrap}textarea{width:100%;min-height:150px;font:12px monospace}#error{color:#ffb2a4;white-space:pre-wrap}.run{margin:8px 0;padding:10px;background:#1a3337;border-radius:8px}.hint{padding:14px;border:1px solid #6eab9055;border-radius:10px;line-height:1.7;margin:12px 0}#fields label{font-size:12px}details{margin-top:12px}summary{cursor:pointer;color:#bde8d1}@media(max-width:1050px){main{grid-template-columns:270px 1fr}aside:last-child{display:none}}@media(max-width:700px){main{display:block;height:auto}aside{max-height:320px}.screen{height:calc(100dvh - 65px)}header{padding:10px;font-size:12px}header b{font-size:16px}}
</style></head><body><header><a href="/planner/">← 기획서</a><b>정화숲 · 실제 플레이 제작실</b><small>동일한 3D 게임으로 설정 → 플레이 → 결과 확인</small></header><main><aside><div class="tabs" id="tabs"></div><h2>시험 설정</h2><label>캐릭터<select id="char"><option value="RUON_35">루온 · 3.5등신</option><option value="RIA_35">리아 · 3.5등신</option><option value="RUON">루온 · 기본</option><option value="RIA">리아 · 기본</option></select></label><label>함께할 펫<select id="pet"><option value="">없음</option><option value="nofilter">노필터</option><option value="block_cat">블록 고양이</option><option value="flux">플럭스</option><option value="lumos">루모스</option><option value="gizmo">기즈모</option></select></label><label>지역<select id="region"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>난수 시드<input id="seed" type="number" value="20261011" min="0"></label><label><span>첫 플레이 안내</span><input id="tutorial" type="checkbox" checked></label><label id="facilityRow"><span>시설만 방어</span><input id="facility" type="checkbox"></label><button class="wide" id="start">설정으로 다시 실행</button><div id="error"></div><h2>수치 편집</h2><div id="fields"></div><details><summary>전체 전투 설정 JSON</summary><textarea id="json" spellcheck="false"></textarea><button id="jsonApply">JSON을 수치에 반영</button></details><div class="row"><button id="save">설정 저장</button><button id="reset">이번 수정 되돌리기</button></div><div class="hint">시험은 캠페인 별·미션·펫 해금을 바꾸지 않습니다. 실제 진행은 로비에서 외출해 도전하세요.</div><button id="campaign">캠페인 로비 열기</button><details><summary>공통·스킬·적·스폰·대열 편집</summary><select id="table"></select><textarea id="tableJSON" style="min-height:300px"></textarea><button id="saveTable">표 저장</button></details></aside><section class="screen"><iframe id="game" title="실제 3D 게임" allow="fullscreen"></iframe></section><aside><h2>현재 플레이</h2><div class="status" id="status">로딩 중…</div><h2>이번 검수 결과</h2><div id="result"></div><button id="download">시험 기록 내려받기</button><h2>플레이 안내</h2><p id="guide" style="line-height:1.8"></p><h2>기술·진화 효과 시험</h2><select id="effect"></select><button id="effectRun">선택한 효과 적용</button><button id="effectAll">모든 일반 기술 적용</button><p class="hint">시험 중 선택한 효과에 집중합니다. 다시 실행하면 일반 성장으로 돌아갑니다. 캠페인 저장 제외.</p><h2>최근 시험</h2><div id="runs"></div></aside></main><script>
const $=id=>document.getElementById(id),labels={lobby:'공중섬 로비',cards:'카드 미션',p01:'① 코어 방어',p02:'② FPS 방어',p03:'③ 대생존',p04:'④ 체인 디펜스',p05:'⑤ 수색 돌파',p06:'⑥ 구출 호위와 탈출',p07:'⑦ 정화 복구',raid:'마을 침략'};let tables,selected='p01',params={},defaults={},results=JSON.parse(localStorage.getItem('arcade.planner.results')||'[]'),lastState=null,lastReplay=null;
const paths={lobby:'arcade-lobby.html',cards:'arcade-cards.html',p01:'arcade-game1.html',p02:'arcade-game2.html',p03:'arcade-game3.html',p04:'arcade-game4.html',p05:'arcade-game5.html',p06:'arcade-game6.html',p07:'arcade-game7.html',raid:'arcade-lobby.html'};
const fieldNames={hp:'HP',speedMps:'이동 속도(m/s)',damage:'피해',initialPoints:'시작 정화석',survivalSec:'생존 시간(초)',maxEnemies:'동시 적 수',intervalSec:'공격 간격(초)',rangeM:'사거리(m)',blastRadiusM:'폭발 반경(m)',midBossAtSec:'중간 보스 시점(초)',waveCount:'웨이브 수',killPoints:'일반 적 처치 정화석',eliteKillPoints:'정예 처치 정화석',ultimateDamage:'정화 폭격 피해',ultimateCharges:'정화 폭격 횟수',nominalWaveSec:'웨이브 기준 시간(초)',speedMps:'이동 속도(m/s)'};
const guides={lobby:'집 5채의 공중섬에서 주민과 구조한 펫이 생활합니다. 외출하면 비행선으로 카드 미션에 이동합니다.',cards:'5지역 × 7게임. 캠페인은 이전 미션을 정화해야 다음 카드가 열립니다. 제작실에서는 전부 시험할 수 있습니다.',p01:'건설 칸을 눌러 시설 설치 → 전투 시작. 코어와 캐릭터를 지키며 3웨이브와 보스를 정화합니다. WASD 또는 드래그 이동.',p02:'준비는 코어 방어와 동일합니다. 전투가 시작되면 FPS. 왼쪽 이동 · 오른쪽 드래그 시점. 시야 중앙 가까운 적을 자동 사격합니다.',p03:'이동하며 정화 구슬을 모으고 3택 성장. 러시·대열과 중간 보스가 등장합니다. 생존 시간이 끝난 뒤 최종 보스를 실제로 처치해야 승리합니다.',p05:'6종의 방에서 적 정화 → 북쪽 출구. 마지막 보스와 출구까지 실제 도달해야 성공.',p06:'수레 가까이 머무르며 적을 막으세요. 갈림길의 짧은 길·우회 길을 고르고 동물 구출 뒤 탈출 거점까지 호위합니다.',p07:'걸으며 바닥을 정화하세요. E 또는 작업 버튼으로 정화석을 채집하고 시설 3곳을 복구합니다.',raid:'공중마을 침략을 즉시 시험합니다. 시설·펫이 날아오는 적을 막고 방어 코어를 지킵니다.',p04:'좌우 이동(AD/드래그)하며 자동 사격. 숫자는 적 HP. 다중 탄환·연사·관통을 조합합니다. 한 마리라도 붉은 선에 닿으면 패배합니다.'};
function merge(a,b){if(!b||typeof b!=='object'||Array.isArray(b))return b===undefined?a:b;const o={...a};for(const[k,v]of Object.entries(b))o[k]=merge(o[k],v);return o;}function resolve(includeMission=true){let p=tables.profiles.profiles.find(p=>p.id===selected);if(!p)return{};const parent=p.inheritsProfileId?tables.profiles.profiles.find(x=>x.id===p.inheritsProfileId):null,region=tables.campaign.regions.find(r=>r.region===Number($('region').value)),mission=tables.campaign.missions.find(m=>m.profileId===selected&&m.region===Number($('region').value)),t=region?.combatTuning??{};let v=structuredClone(merge(merge(tables.rulesets.rulesets.find(r=>r.id===p.rulesetId).params,parent?.overrides?.params),p.overrides?.params));if(p.rulesetId==='base-defense'){v.initialPoints+=t.initialPointsAdded??0;v.core.hp+=t.coreHpAdded??0;v.core.damage*=t.coreDamageMultiplier??1;v.facilityOnly.initialPoints+=t.facilityOnlyPointsAdded??0;v.buildOptions=v.buildOptions.map(f=>({...f,hp:Math.round(f.hp*(t.facilityHpMultiplier??1)),...(f.damage!==undefined?{damage:f.damage*(t.facilityDamageMultiplier??1)}:{}),...(f.secondaryDamage!==undefined?{secondaryDamage:f.secondaryDamage*(t.facilityDamageMultiplier??1)}:{}),...(f.hpByLevel?{hpByLevel:f.hpByLevel.map(v=>Math.round(v*(t.facilityHpMultiplier??1)))}:{})}));v.auxiliarySlotsUnlockedByPrep=[Math.max(v.auxiliarySlotsUnlockedByPrep[0],t.initialBuildSlots??0),...v.auxiliarySlotsUnlockedByPrep.slice(1)];}if(p.rulesetId==='horde-survival')v.startingGrowthChoices=(v.startingGrowthChoices??0)+(t.startingGrowthChoicesAdded??0);return includeMission?merge(v,mission?.overrides?.params):v;}
function delta(base,value){if(JSON.stringify(base)===JSON.stringify(value))return undefined;if(!value||typeof value!=='object'||Array.isArray(value))return value;const out={};for(const[k,v]of Object.entries(value)){const d=delta(base?.[k],v);if(d!==undefined)out[k]=d;}return Object.keys(out).length?out:undefined;}
function renderFields(){const list=$('fields');list.innerHTML='';const flat=(o,path='')=>{for(const[k,v]of Object.entries(o)){const key=path?path+'.'+k:k;if(typeof v==='number'&&Number.isFinite(v)&&(!path||['core','player','midBoss','finalBoss'].includes(path))){const l=document.createElement('label'),s=document.createElement('span'),inp=document.createElement('input');s.textContent=(path?({core:'코어',player:'플레이어',midBoss:'중간 보스',finalBoss:'마지막 보스'}[path]||path)+' · ':'')+(fieldNames[k]||k);inp.type='number';inp.step='any';inp.value=v;inp.dataset.path=key;inp.onchange=()=>{let obj=params;const parts=key.split('.');for(const p of parts.slice(0,-1))obj=obj[p];obj[parts.at(-1)]=Number(inp.value);$('json').value=JSON.stringify(params,null,2);};l.append(s,inp);list.append(l);}else if(v&&typeof v==='object'&&!Array.isArray(v))flat(v,key);}};flat(params);$('json').value=JSON.stringify(params,null,2);}
function choose(id){selected=id;effectOptions();document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));defaults=structuredClone(resolve());params=structuredClone(defaults);renderFields();$('facilityRow').style.display=id==='p01'?'':'none';$('guide').textContent=guides[id];start();}
function start(){try{$('error').textContent='';const q=new URLSearchParams({planner:'1',char:$('char').value,seed:$('seed').value,tutorial:$('tutorial').checked?'1':'0'});if(selected==='raid')q.set('raid','1');if(selected.startsWith('p')){q.set('mission',`r${String($('region').value).padStart(2,'0')}-${selected}`);q.set('overrides',btoa(encodeURIComponent(JSON.stringify({params}))));}if($('pet').value)q.set('pet',$('pet').value);if(selected==='p01'&&$('facility').checked)q.set('variant','facilityOnly');$('game').src='http://localhost:5190/'+paths[selected]+'?'+q;$('status').textContent='리소스를 불러오는 중…';$('result').textContent='';}catch(e){$('error').textContent=e.message;}}
window.addEventListener('message',async e=>{if(e.origin!=='http://localhost:5190'||e.source!==$('game').contentWindow)return;const d=e.data;if(d?.type==='arcade:state'){lastState=d.state;const s=d.state;$('status').textContent=`${labels[s.profileId]} · ${s.phase}\n시간 ${s.time.toFixed(1)}초 · 웨이브 ${s.wave}\n남은 적 ${s.enemies} · 처치 ${s.kills}\n레벨 ${s.level}\n피해: 인간 ${Math.round(s.damage.character)} / 스킬 ${Math.round(s.damage.skill)}\n시설 ${Math.round(s.damage.facility)} / 펫 ${Math.round(s.damage.pet)}\n시드 ${s.seed}\n설정 ${s.hash}\n시험 모드(캠페인 저장 제외)`;}if(d?.type==='arcade:ready'){const part=d.part||d.profileId;if(part&&labels[part]){const changed=selected!==part||d.region&&Number($('region').value)!==d.region;if(d.region)$('region').value=String(d.region);selected=part;effectOptions();document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.id===part));if(changed){defaults=structuredClone(resolve());params=structuredClone(defaults);renderFields();}$('facilityRow').style.display=part==='p01'?'':'none';$('guide').textContent=guides[part];}$('status').textContent=(labels[part]||'실제 플레이')+' 준비 완료';}if(d?.type==='arcade:raid-result'){$('result').textContent=(d.result.status==='win'?'마을 방어 성공':'방어시설 재정비')+' · '+d.result.kills+'마리 정화 · 펫 '+d.result.pets+'마리 지원';}if(d?.type==='arcade:result'){lastReplay=d.replay;results.unshift(d.result);results=results.slice(0,100);localStorage.setItem('arcade.planner.results',JSON.stringify(results));$('result').textContent=(d.result.status==='win'?'정화 성공':'정화 실패')+' · '+d.result.reason+' · '+d.result.stars+'★';renderRuns();await fetch('/api/arcade/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d.result)});}});
function renderRuns(){$('runs').innerHTML='';for(const r of results.slice(0,6)){const d=document.createElement('div');d.className='run';d.textContent=labels[r.profileId]+' · '+(r.status==='win'?'성공':'실패')+' · '+r.battleSec.toFixed(1)+'초 · '+r.kills+'처치';$('runs').append(d);}}
$('region').onchange=()=>choose(selected);$('start').onclick=start;$('reset').onclick=()=>{params=structuredClone(defaults);renderFields();};$('jsonApply').onclick=()=>{try{params=JSON.parse($('json').value);renderFields();}catch(e){$('error').textContent=e.message;}};$('campaign').onclick=()=>window.open('http://localhost:5190/arcade-lobby.html','_blank');
$('save').onclick=async()=>{try{const m=tables.campaign.missions.find(m=>m.profileId===selected&&m.region===Number($('region').value));if(!m)throw Error('게임을 선택하세요.');m.overrides={...m.overrides,params:delta(resolve(false),params)??{}};const r=await fetch('/api/arcade/config/campaign',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(tables.campaign)});if(!r.ok)throw Error((await r.json()).error);defaults=structuredClone(params);$('error').textContent='선택한 지역·미션 설정 저장 완료. 다음 플레이부터 사용합니다.';}catch(e){$('error').textContent=e.message;}};
$('table').onchange=()=>{$('tableJSON').value=JSON.stringify(tables[$('table').value],null,2);};$('saveTable').onclick=async()=>{try{const id=$('table').value,value=JSON.parse($('tableJSON').value);const r=await fetch('/api/arcade/config/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(value)});if(!r.ok)throw Error((await r.json()).error);tables[id]=value;$('error').textContent=id+' 표 저장 완료';}catch(e){$('error').textContent=e.message;}};
$('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({author:'Codex',lastState,results,replay:lastReplay},null,2)],{type:'application/json'}));a.download='arcade-playtest.json';a.click();URL.revokeObjectURL(a.href);};

const effectNames={"fire-rocket": "화염 바주카", "ice-rocket": "얼음 바주카", "bolt-rocket": "번개 바주카", "fire-home": "화염 유도탄", "ice-home": "얼음 유도탄", "bolt-home": "번개 유도탄", "fire-pillar": "불기둥(진화)", "chain-three": "삼연쇄 번개(진화)", "orbit-four": "서리 위성 4(진화)", "carpet-three": "융단 폭격(진화)", "return-crystal": "돌아오는 수정", "orbit-shards": "서리 조각", "bounce-block": "튕기는 블록", "pierce-drill": "관통 드릴", "fan-slash": "부채날", "slow-aura": "서리 장막", "lightning-chain": "번개 사슬", "ground-mine": "정화 지뢰", "spread-stream": "산탄 블록", "pet-drone-a": "정화 드론 A", "pet-drone-b": "정화 드론 B", "flame-field": "잔류 화염"};
function effectOptions(){const sel=$('effect');sel.innerHTML='';const profile=tables.profiles.profiles.find(p=>p.id===selected);if(!profile)return;for(const w of tables.skills.entries.filter(w=>w.slot==='active'&&w.allowedRulesets.includes(profile.rulesetId))){const o=document.createElement('option');o.value=w.id;o.textContent=(effectNames[w.id]||w.id)+(w.evolutionOnly?' · 진화':'');sel.append(o);}}
$('effectRun').onclick=()=>$('game').contentWindow.postMessage({type:'arcade:showcase',skill:$('effect').value},'http://localhost:5190');$('effectAll').onclick=()=>$('game').contentWindow.postMessage({type:'arcade:showcase',skill:'all'},'http://localhost:5190');

(async()=>{tables=await(await fetch('/api/arcade/config')).json();for(const[id,title]of Object.entries(labels)){const b=document.createElement('button');b.textContent=title;b.dataset.id=id;b.onclick=()=>choose(id);$('tabs').append(b);}for(const id of Object.keys(tables)){const o=document.createElement('option');o.value=id;o.textContent=id;$('table').append(o);}$('table').onchange();renderRuns();choose(new URLSearchParams(location.search).get('part')||'p01');})().catch(e=>$('error').textContent=e.message);
</script></body></html>
